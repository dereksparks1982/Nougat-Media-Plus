<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020f0b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nougat">
  <title>Nougat Media Plus</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./modules.css">
  <link rel="stylesheet" href="./modules-live-tv.css">
  <link rel="stylesheet" href="./modules-scrollbars.css">
  <link rel="stylesheet" href="./modules-media-card-actions.css">
  <link rel="stylesheet" href="./library-polish.css">
  <link rel="stylesheet" href="./player-activity.css">
  <link rel="stylesheet" href="./player-chapters.css">
  <link rel="stylesheet" href="./player-tracks.css">
  <link rel="stylesheet" href="./player-context.css">
  <link rel="stylesheet" href="./enhancements.css">
</head>
<body>
  <header class="topbar">
    <img class="topbar-brand" src="./assets/branding/nougat-media-plus-topbar-lockup.png" alt="Nougat Media Plus">
    <div class="topbar-state">
      <span class="server-label">Server:</span>
      <span class="server-light" id="serverLight" aria-hidden="true"></span>
      <span class="server-text" id="healthBadge">Connecting</span>
      <span class="version-label">WEB</span>
    </div>
  </header>

  <aside class="module-rail" aria-label="Nougat modules">
    <button class="rail-button active" type="button" data-view="home"><span class="rail-icon">⌂</span><span>HOME</span></button>
    <button class="rail-button" type="button" data-view="player"><span class="rail-icon">▶</span><span>PLAYER</span></button>
    <button class="rail-button" type="button" data-view="library"><span class="rail-icon">▦</span><span>LIBRARY</span></button>
    <button class="rail-button" type="button" data-view="discover"><span class="rail-icon">◇</span><span>DISCOVER</span></button>
    <button class="rail-button" type="button" data-view="livetv"><span class="rail-icon">▣</span><span>LIVE TV</span></button>
    <button class="rail-button" type="button" data-view="worldtv"><span class="rail-icon">◎</span><span>WORLD TV</span></button>
    <button class="rail-button" type="button" data-view="radio"><span class="rail-icon">◉</span><span>RADIO</span></button>
    <button class="rail-button" type="button" data-view="search"><span class="rail-icon">⌕</span><span>SEARCH</span></button>
    <button class="rail-button" type="button" data-view="stream"><span class="rail-icon">↗</span><span>STREAM</span></button>
    <button class="rail-button" type="button" data-view="studio"><span class="rail-icon">◆</span><span>STUDIO</span></button>
    <button class="rail-button" type="button" data-view="games"><span class="rail-icon">✦</span><span>GAMES</span></button>
    <button class="rail-button" type="button" data-view="network"><span class="rail-icon">⌁</span><span>NETWORK</span></button>
    <button class="rail-button" type="button" data-view="system"><span class="rail-icon">⚙</span><span>SYSTEM</span></button>
    <img class="rail-n" src="./assets/branding/nougat-media-plus-dock-N.png" alt="">
  </aside>

  <main class="app-content">
    <section class="view active" id="homeView" data-view-panel="home" aria-label="Nougat Home">
      <div class="view-scroll">
        <h2 class="section-title">CONTINUE WATCHING</h2>
        <div class="continue-shell"><div class="card-row" id="continueRow"></div></div>
        <h2 class="section-title local-title">LOCAL</h2>
        <div class="home-grid" id="homeGrid"></div>
      </div>
    </section>

    <section class="view" id="playerView" data-view-panel="player" aria-label="Nougat Player">
      <div class="player-page">
        <div class="video-frame">
          <video id="player" playsinline preload="metadata"></video>
          <div class="empty-player" id="emptyPlayer"><strong>NO MEDIA LOADED</strong><span>Select a movie or episode from Home or Library.</span></div>
          <div class="player-title-hud" id="playerTitleHud" hidden>Nothing selected</div>
        </div>
        <div class="player-hud">
          <div class="seek-row">
            <span class="time-label" id="currentTime">0:00</span>
            <input class="seek-control" id="seekControl" type="range" min="0" max="1000" value="0" aria-label="Seek">
            <span class="time-label" id="durationTime">0:00</span>
          </div>
          <div class="transport-row">
            <button type="button" class="sheet-button transport-button" id="prevItem" title="Previous item">⏮</button>
            <button type="button" class="sheet-button transport-button" id="back30" title="Back 30 seconds">↶30</button>
            <button type="button" class="sheet-button transport-button primary-transport" id="playPause" title="Play or pause">▶</button>
            <button type="button" class="sheet-button transport-button" id="forward30" title="Forward 30 seconds">30↷</button>
            <button type="button" class="sheet-button transport-button" id="nextItem" title="Next item">⏭</button>
            <div class="volume-bank" id="volumeBank" aria-label="Volume"></div>
            <button type="button" class="sheet-button transport-button" id="compatButton" disabled title="Toggle browser compatibility">COMPAT</button>
            <button type="button" class="sheet-button transport-button" id="fullscreenButton" title="Fullscreen">⛶</button>
          </div>
        </div>
        <p class="player-status" id="playerStatus" aria-live="polite">READY</p>
      </div>
    </section>

    <section class="view" id="libraryView" data-view-panel="library" aria-label="Nougat Library">
      <div class="library-toolbar">
        <button type="button" class="sheet-button active-tool" id="moviesFilter">Movies</button>
        <button type="button" class="sheet-button" id="tvFilter">Television</button>
        <label class="search-box" for="search"><span>SEARCH</span><input id="search" type="search" autocomplete="off" spellcheck="false"></label>
        <button type="button" class="sheet-button" id="refreshButton">Refresh</button>
        <span class="toolbar-spacer"></span>
        <button type="button" class="sheet-button view-mode" id="listViewButton" aria-label="List view">☷</button>
        <button type="button" class="sheet-button view-mode active-tool" id="gridViewButton" aria-label="Grid view">▦</button>
      </div>
      <p class="catalog-status" id="catalogStatus" aria-live="polite">Loading Nougat Library...</p>
      <div class="library-grid" id="libraryGrid"></div>
      <div class="library-list" id="libraryList" hidden></div>
    </section>

    <section class="view" id="moduleView" data-view-panel="module" aria-label="Nougat module">
      <span id="moduleTitle" hidden></span><span id="moduleMessage" hidden></span>
    </section>
  </main>

  <script src="./config.js"></script>
  <script src="./modules.js"></script>
  <script src="./modules-broadcast.js"></script>
  <script src="./modules-world-tv-catalog.js"></script>
  <script src="./modules-world-tv-guide.js"></script>
  <script src="./modules-radio.js"></script>
  <script src="./modules-radio-modes.js"></script>
  <script src="./modules-radio-cellular.js"></script>
  <script src="./modules-live-tv.js"></script>
  <script src="./modules-live-tv-auto-refresh.js"></script>
  <script src="./modules-studio-games.js"></script>
  <script src="./modules-studio-extra.js"></script>
  <script src="./modules-games-extra.js"></script>
  <script src="./modules-network-satellite.js"></script>
  <script src="./modules-system.js"></script>
  <script src="./modules-system-extra.js"></script>
  <script src="./modules-system-tuner.js"></script>
  <script src="./modules-system-tmdb.js"></script>
  <script src="./modules-search-discover.js"></script>
  <script src="./modules-p2p-network.js"></script>
  <script src="./modules-stream.js"></script>
  <script src="./modules-catalog-cache.js"></script>
  <script src="./app.js"></script>
  <script src="./player-enhancements.js"></script>
  <script src="./player-chapters.js"></script>
  <script src="./player-tracks.js"></script>
  <script src="./player-context.js"></script>
  <script src="./player-input.js"></script>
  <script src="./player-resume.js"></script>
  <script src="./modules-bridge.js"></script>
  <script src="./modules-media-card-actions.js"></script>
</body>
</html>
