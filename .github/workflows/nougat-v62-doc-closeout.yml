name: Nougat v0.0.62 Documentation Closeout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nougat-v62-doc-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact v0.0.61 parent
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE="23241d075a008e311c850cfad3d372635b563022"
          PARENT="$(git rev-parse HEAD^)"
          if [ "$PARENT" != "$EXPECTED_BASE" ]; then
            echo "STOP: workflow bootstrap is not directly on the accepted v0.0.61 GitHub baseline."
            echo "Expected parent: $EXPECTED_BASE"
            echo "Actual parent:   $PARENT"
            exit 1
          fi
          CHANGED="$(git diff --name-only HEAD^ HEAD)"
          if [ "$CHANGED" != ".github/workflows/nougat-v62-doc-closeout.yml" ]; then
            echo "STOP: bootstrap commit changed something other than the closeout workflow."
            printf '%s\n' "$CHANGED"
            exit 1
          fi

      - name: Apply accepted v0.0.62 documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          # README: current product identity + one authoritative v0.0.62 section.
          p = root / 'README.md'
          text = p.read_text()
          marker = '\n## v0.0.61 -'
          if marker not in text:
              raise SystemExit('STOP: README v0.0.61 anchor not found.')
          if '## v0.0.62 - Nougat Media Plus Tactical UI Conversion' in text:
              raise SystemExit('STOP: README already contains v0.0.62 section.')
          prefix, history = text.split(marker, 1)
          prefix = prefix.replace('# Nougat Media Suite\n', '# Nougat Media Plus\n', 1)
          prefix = prefix.replace('Nougat Media Suite', 'Nougat Media Plus')
          v62 = '''
          ## v0.0.62 - Nougat Media Plus Tactical UI Conversion

          Nougat Media Plus v0.0.62 is the owner-accepted product identity and tactical-interface release built from the accepted v0.0.61 baseline.

          ### Nougat Media Plus identity

          - Renames the active application from **Nougat Media Suite** to **Nougat Media Plus**.
          - Advances the runnable root executable to **`Nougat_Media_Plus_v62`**.
          - Replaces the active chocolate/caramel Nougat N with the owner-approved metallic tactical green **N**.
          - Applies the new N to the in-app identity, raw executable, installed launcher, Ubuntu/GNOME dock and app switcher, and X11 window identity.
          - Removes the rejected legacy-name subtitle from the active top-left application lockup.
          - Advances all active version reporting to **v0.0.62**.

          ### Tactical interface

          - Establishes the dark black/deep-green Nougat Media Plus tactical interface as the active system-wide visual direction.
          - Adds angular clipped/leaf-style top navigation, tabs, buttons, panels, dialogs, fields, status surfaces, and supporting control treatments.
          - Preserves the approved Video Player tactical appearance.
          - Repairs the rejected blank-page regression by preventing the final tactical page-frame pass from filling over already-rendered page contents.
          - Preserves the underlying Home, Library, Discover, Live TV, World TV, Radio, Search, Stream, Studio, Games, Debug/System, and Video Player behavior while applying the new visual system.

          ### UI audio

          - Adds the approved **UI Click Deep** sound as a one-shot pointer-entry hover sound.
          - Adds the approved **el_boss UI Button Click** as the one-shot activation sound.
          - Hover audio plays once when the pointer enters a button, does not repeat while the pointer remains inside it, and may play again only after leaving and re-entering.
          - Activation audio plays once per actual button activation.
          - Disabled controls remain silent and neither UI sound loops.

          ### Games carry-forward

          - The known NES, SNES, and Xbox 360 emulator issues documented in v0.0.61 are not falsely marked fixed by this UI release.
          - The complete Games/emulator overhaul remains follow-on work from the accepted Nougat Media Plus interface baseline.
          '''
          import textwrap
          v62 = textwrap.dedent(v62).strip()
          text = prefix.rstrip() + '\n\n' + v62 + marker + history
          p.write_text(text)

          # CHANGELOG
          p = root / 'CHANGELOG.md'
          text = p.read_text()
          if '## v0.0.62 - OWNER-ACCEPTED NOUGAT MEDIA PLUS UI' not in text:
              entry = '''## v0.0.62 - OWNER-ACCEPTED NOUGAT MEDIA PLUS UI

          - Renamed the active product to Nougat Media Plus.
          - Advanced the active executable to Nougat_Media_Plus_v62.
          - Installed the approved metallic tactical green N across the application, executable, launcher, dock/app-switcher and X11 identity.
          - Applied the black/deep-green tactical UI direction and angular control family system-wide.
          - Removed the rejected legacy-name subtitle from the active top-left lockup.
          - Corrected active version presentation to v0.0.62.
          - Repaired the blank-page regression caused by the tactical page-frame pass painting over page contents.
          - Preserved the approved Video Player tactical appearance.
          - Added one-shot hover and activation UI sounds with no looping.
          - Known v0.0.61 emulator regressions remain documented for follow-on Games/emulator work.

          '''
              text = textwrap.dedent(entry) + text
              p.write_text(text)

          # ROADMAP
          p = root / 'ROADMAP.md'
          text = p.read_text()
          old = '## v0.0.62 - Complete Games and Emulator Overhaul'
          if old in text:
              text = text.replace(old, '## v0.0.63 - Complete Games and Emulator Overhaul', 1)
          accepted = '''## v0.0.62 accepted - Nougat Media Plus Tactical UI Conversion

          - Nougat Media Plus product rename accepted.
          - Tactical black/deep-green system-wide UI baseline accepted.
          - New metallic tactical green N accepted across active identity surfaces.
          - One-shot hover and activation sounds accepted.
          - Blank-page regression repaired before acceptance.
          - Complete Games/emulator overhaul continues in the next numeric build from this accepted interface baseline.

          '''
          if '## v0.0.62 accepted - Nougat Media Plus Tactical UI Conversion' not in text:
              text = textwrap.dedent(accepted) + text
          p.write_text(text)

          # Company Bible: replace only the obsolete active identity law.
          p = root / 'COMPANY_BIBLE.md'
          text = p.read_text()
          start = text.find('## 7. Nougat Media Suite identity law')
          end = text.find('## 8. Media-server ownership law')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('STOP: Company Bible identity-law anchors not found.')
          identity = '''## 7. Nougat Media Plus identity law

          Beginning with v0.0.62, the owner-approved metallic tactical green **N** in `assets/branding/nougat-media-plus-master-N.png`, derived from the approved `assets/ui/NOUGAT_MEDIA_PLUS_UI_AUTHORITY.png` visual authority, is the sole active Nougat Media Plus icon source. The prior chocolate/caramel Nougat N remains historical identity through v0.0.61 and must not remain active on current builds.

          **NO EXCEPTIONS RELEASE GATE:** every Nougat Media Plus build, patch, repair, hotfix, and version bump must preserve and verify the approved tactical green N on every active application identity surface before the candidate may be handed to the owner.

          The mandatory identity surfaces are:
          - the raw versioned root executable as shown by Files/Nautilus;
          - the installed application launcher/menu entry;
          - the running X11 window identity and `_NET_WM_ICON`;
          - the Ubuntu/GNOME dock and app-switcher identity;
          - the in-app Nougat Media Plus badge/lockup.

          The active in-app product identity is **NOUGAT MEDIA PLUS**. Do not add a legacy product-name subtitle beneath the active name.

          The final raw versioned executable must be written first. Only after the final executable bytes are in place may its `metadata::custom-icon` be set directly to the approved tactical green N master URI. The metadata must immediately be read back and proved to resolve to that exact master. Rebuilding, moving, or replacing the executable after that proof invalidates the icon gate and requires the assignment and verification to be repeated.

          Each version-changing build must refresh the Nougat Media Plus icon-theme assets and canonical desktop launcher as required, verify the launcher icon key and executable target, and refresh desktop/icon caches when the relevant host utilities are available. A generic icon, the retired chocolate/caramel N, or another substitute on any required active surface is a build rejection.

          Automated validation must verify the approved tactical UI authority, approved Nougat Media Plus N master, embedded X11 icon-data source, launcher icon key, raw-executable custom-icon URI readback, active Nougat Media Plus product name, and current numeric version. Owner visual confirmation in Files/Nautilus and the running dock remains required for final acceptance.

          '''
          identity = textwrap.dedent(identity)
          text = text[:start] + identity + text[end:]
          text = text.replace('# Nougat Media Suite Company Bible', '# Nougat Media Plus Company Bible', 1)
          text = text.replace('**Scope:** Nougat Media Suite only', '**Scope:** Nougat Media Plus only', 1)
          p.write_text(text)

          print('PASS: accepted v0.0.62 documentation prepared.')
          PY

      - name: Commit documentation closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Derek Sparks"
          git config user.email "dereksparks1982@gmail.com"
          rm -f .github/workflows/nougat-v62-doc-closeout.yml
          git add -A -- README.md CHANGELOG.md ROADMAP.md COMPANY_BIBLE.md .github/workflows/nougat-v62-doc-closeout.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "STOP: no documentation changes were produced."
            exit 1
          fi
          git commit -m "Document accepted v0.0.62 Nougat Media Plus tactical UI"
          git push origin HEAD:main
