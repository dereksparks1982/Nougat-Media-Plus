name: Nougat Media Plus v0.0.65 Candidate Build

on:
  push:
    branches:
      - candidate/v0.0.65
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-v65-ui:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: candidate/v0.0.65
          lfs: false
          fetch-depth: 1
      - name: Apply existing v65 patch
        run: python3 tools/v65_patch.py
      - name: Inspect Radio and sidebar UI anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('src/main.cpp').read_text().splitlines()
          groups={
            'RADIO':['radioServiceTabs','radioPanel','RadioPanel::','radioPreset','radioTune','radioScan','radioConnect','radioRefresh','radioRecord','radioStop','radioAntennaScanBtn'],
            'ICON':['branding','png','PNG','Pixmap','sidebar','SIDEBAR','appIcon','AppIcon','logo','Logo','icon','Icon','NOUgat','NOUGAT']
          }
          for title,needles in groups.items():
            hits=[i for i,l in enumerate(lines) if any(n in l for n in needles)]
            print(f'===== {title} HIT COUNT {len(hits)} =====')
            blocks=[]
            for i in hits:
              a=max(0,i-18); b=min(len(lines),i+19)
              if any(not (b < aa or a > bb) for aa,bb in blocks): continue
              blocks.append((a,b))
              if len(blocks)>=30: break
            for a,b in blocks:
              print(f'===== {title} CONTEXT {a+1}-{b} =====')
              for j in range(a,b): print(f'{j+1:06d}: {lines[j]}')
          PY
