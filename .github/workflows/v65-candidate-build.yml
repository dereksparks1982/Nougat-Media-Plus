name: Nougat Media Plus v0.0.65 Visible UI Repair

on:
  push:
    branches:
      - candidate/v0.0.65
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v65-prebuilt:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    steps:
      - name: Install build and checkout dependencies first
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake pkg-config libx11-dev libtorrent-rasterbar-dev \
            git git-lfs python3 python3-pil zip file ca-certificates

      - name: Checkout candidate after Git is available
        uses: actions/checkout@v4
        with:
          ref: candidate/v0.0.65
          lfs: false
          fetch-depth: 1

      - name: Materialize only the AI runtime LFS objects
        run: |
          cd "$GITHUB_WORKSPACE"
          test -d .git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --show-toplevel
          git lfs version
          git lfs pull --include="components/ai/runtime/**" --exclude=""
          test -f components/ai/runtime/include/llama.h
          test -e components/ai/runtime/lib/libllama.so
          if head -n 1 components/ai/runtime/include/llama.h | grep -q 'git-lfs'; then
            echo 'STOP: llama.h is still an LFS pointer'
            false
          fi

      - name: Apply approved v65 source and visible UI repairs
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 tools/v65_patch.py
          python3 tools/v65_ui_repair.py
          python3 tools/v65_visible_ui_repair.py
          sed -i 's/ || label=="TV Antenna Scan"//g' src/main.cpp

          grep -q 'NOUGAT_V65_APPROVED_MILITARY_SEEK' src/main.cpp
          grep -q 'NOUGAT_V65_VISIBLE_OUTLINED_COMMAND' src/main.cpp
          grep -q 'NOUGAT_V65_VISIBLE_STATEFUL_OUTLINED_COMMAND' src/main.cpp
          grep -q 'NOUGAT_V65_VISIBLE_ONE_ROW_RADIO_MODES' src/main.cpp
          grep -q 'NOUGAT_V65_SYSTEM_COMMAND_LANE' src/main.cpp
          grep -q 'NOUGAT_V65_DOCK_ICON_BORDER_CLEANUP' src/main.cpp
          grep -q 'command_button_state(target,radioListenBtn' src/main.cpp
          grep -q 'command_button_state(target,radioScanBtn' src/main.cpp
          grep -q 'command_button_state(target,radioRecordBtn' src/main.cpp

          if grep -q 'TV Antenna Scan' src/main.cpp; then
            echo 'STOP: stale TV Antenna Scan reference remains in Radio source'
            grep -n 'TV Antenna Scan' src/main.cpp
            false
          fi

          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/main.cpp').read_text()
          for sig in (
              'void button_on(Drawable target, const Rect& r, const std::string& label)',
              'void command_button_state(Drawable target, const Rect& r, const std::string& label,',
          ):
              start=s.find(sig)
              if start < 0: raise SystemExit('STOP: command renderer missing: '+sig)
              brace=s.find('{',start); depth=0
              for i in range(brace,len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0:
                          body=s[start:i+1]
                          break
              if 'draw_tactical_polygon(target' in body or 'fill(target' in body or 'fill_round(target' in body:
                  raise SystemExit('STOP: command renderer is still filled: '+sig)
          print('PASS: System/Radio command renderers are genuinely hollow/outlined')
          PY

      - name: Remove exterior black border from packaged dock icon
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image

          path = Path('assets/branding/nougat-media-plus-master-N.png')
          im = Image.open(path).convert('RGBA')
          px = im.load(); w, h = im.size
          seen=set(); q=deque()

          def dark(x,y):
              r,g,b,a=px[x,y]
              return a>0 and r<=38 and g<=38 and b<=38
          def seed(x,y):
              if (x,y) in seen or not dark(x,y): return
              seen.add((x,y)); q.append((x,y))

          for x in range(w): seed(x,0); seed(x,h-1)
          for y in range(h): seed(0,y); seed(w-1,y)
          while q:
              x,y=q.popleft()
              for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                  if 0<=nx<w and 0<=ny<h: seed(nx,ny)
          for x,y in seen:
              r,g,b,_=px[x,y]; px[x,y]=(r,g,b,0)
          im.save(path)
          print(f'Cleaned {len(seen)} exterior black pixels; green rim preserved.')
          PY

      - name: Configure real v65 build
        run: |
          cd "$GITHUB_WORKSPACE"
          cmake -S . -B build-v65-prebuilt -DCMAKE_BUILD_TYPE=Release

      - name: Build real v65 binary
        run: |
          cd "$GITHUB_WORKSPACE"
          cmake --build build-v65-prebuilt --target Nougat_Media_Plus_v65 -j"$(nproc)"

      - name: Verify prebuilt binary
        run: |
          cd "$GITHUB_WORKSPACE"
          test -x build-v65-prebuilt/Nougat_Media_Plus_v65
          LD_LIBRARY_PATH="$PWD/components/ai/runtime/lib:$PWD/components/ai/runtime/lib64" \
            ./build-v65-prebuilt/Nougat_Media_Plus_v65 --version | tee /tmp/v65-version.txt
          grep -q 'Nougat Media Plus v0.0.65' /tmp/v65-version.txt
          file build-v65-prebuilt/Nougat_Media_Plus_v65

      - name: Package changed files and prebuilt executable
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          NAME='Nougat_Media_Plus_v0.0.65_VISIBLE_UI_REPAIR3'
          ROOT="$PWD/dist/$NAME"
          mkdir -p "$ROOT/src/chat" "$ROOT/assets/branding"

          cp -a CMakeLists.txt "$ROOT/CMakeLists.txt"
          cp -a src/main.cpp "$ROOT/src/main.cpp"
          cp -a src/chat/nougat_chat.cpp "$ROOT/src/chat/nougat_chat.cpp"
          cp -a src/chat/nougat_chat.hpp "$ROOT/src/chat/nougat_chat.hpp"
          cp -a assets/branding/nougat-media-plus-master-N.png \
                "$ROOT/assets/branding/nougat-media-plus-master-N.png"
          cp -a build-v65-prebuilt/Nougat_Media_Plus_v65 "$ROOT/Nougat_Media_Plus_v65"
          chmod +x "$ROOT/Nougat_Media_Plus_v65"

          cat > "$ROOT/BUILD_INFO.txt" <<'EOF'
          Nougat Media Plus v0.0.65 Visible Military UI Repair 3

          PREBUILT PACKAGE. The apply script does not run CMake, a compiler, or any rebuild.

          Owner-approved visible repair scope:
          - Preserve the already-approved regular/half-screen/fullscreen military seek bar unchanged.
          - Filled dark green-glass controls remain for navigation, tabs, modes, and selected state.
          - Direct System commands are genuinely hollow angular outlined controls with no filled center.
          - The complete System command inventory remains horizontally scrollable.
          - Radio services/modes are one continuous horizontally scrollable filled green-glass lane, not a two-row grid and not categorized.
          - All direct Radio actions, including Listen, Scan, and Record, use the hollow angular outlined command treatment.
          - TV Antenna Scan belongs to Live TV and is removed from Radio.
          - The dock/sidebar icon removes its exterior black box while preserving the green rim/strip.
          - Nougat Chat scaffolding remains included.
          EOF

          cat > "$ROOT/apply_v65.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          PROJECT="$HOME/DKLab/Projects/Nougat Media Suite"
          ARCHIVE="$HOME/DKLab/Archives/Nougat Media Suite"
          BASE="dbe202300f48c8e53b4ee5ab169b6f9e8e4e2395"
          PKG_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          cd "$PROJECT"

          echo "=== VERIFY NOUGAT v64 GIT BASE ==="
          [ "$(git rev-parse HEAD)" = "$BASE" ] || {
              echo "STOP: Git HEAD is not the accepted v0.0.64 baseline."
              git rev-parse HEAD
              false
          }

          echo "=== SAFE NOUGAT SHUTDOWN ==="
          PIDS=()
          for proc in /proc/[0-9]*; do
              pid="${proc##*/}"
              exe="$(readlink -f "$proc/exe" 2>/dev/null || true)"
              case "$exe" in
                  "$PROJECT"/Nougat_Media_Plus_v*|"$PROJECT"/components/jellyfin/runtime/*)
                      PIDS+=("$pid")
                      ;;
              esac
          done
          if ((${#PIDS[@]})); then
              printf 'Stopping verified Nougat-owned PIDs:'
              printf ' %s' "${PIDS[@]}"
              printf '\n'
              kill "${PIDS[@]}" 2>/dev/null || true
              sleep 2
          fi
          for proc in /proc/[0-9]*; do
              exe="$(readlink -f "$proc/exe" 2>/dev/null || true)"
              case "$exe" in
                  "$PROJECT"/Nougat_Media_Plus_v*|"$PROJECT"/components/jellyfin/runtime/*)
                      echo "STOP: Nougat-owned process still running: $exe"
                      false
                      ;;
              esac
          done

          echo "=== SNAPSHOT CURRENT v65 WORKTREE/EXECUTABLE ==="
          STAMP="$(date +%Y%m%d-%H%M%S)"
          SNAP="$ARCHIVE/v0.0.65-visible-ui-preapply-$STAMP"
          mkdir -p "$SNAP/src/chat" "$SNAP/assets/branding" "$SNAP/desktop-files"
          git status --short > "$SNAP/status.txt"
          git diff --binary > "$SNAP/worktree.patch" || true

          for f in \
              CMakeLists.txt \
              src/main.cpp \
              src/chat/nougat_chat.cpp \
              src/chat/nougat_chat.hpp \
              assets/branding/nougat-media-plus-master-N.png; do
              if [ -e "$PROJECT/$f" ]; then
                  mkdir -p "$SNAP/$(dirname "$f")"
                  cp -a "$PROJECT/$f" "$SNAP/$f"
              fi
          done
          find "$PROJECT" -maxdepth 1 -type f -name 'Nougat_Media_Plus_v*' -exec cp -a {} "$SNAP/" \;

          echo "=== APPLY PREBUILT v0.0.65 VISIBLE UI REPAIR ==="
          mkdir -p "$PROJECT/src/chat" "$PROJECT/assets/branding"
          cp -f "$PKG_DIR/CMakeLists.txt" "$PROJECT/CMakeLists.txt"
          cp -f "$PKG_DIR/src/main.cpp" "$PROJECT/src/main.cpp"
          cp -f "$PKG_DIR/src/chat/nougat_chat.cpp" "$PROJECT/src/chat/nougat_chat.cpp"
          cp -f "$PKG_DIR/src/chat/nougat_chat.hpp" "$PROJECT/src/chat/nougat_chat.hpp"
          cp -f "$PKG_DIR/assets/branding/nougat-media-plus-master-N.png" \
                "$PROJECT/assets/branding/nougat-media-plus-master-N.png"
          cp -f "$PKG_DIR/Nougat_Media_Plus_v65" "$PROJECT/Nougat_Media_Plus_v65"
          chmod +x "$PROJECT/Nougat_Media_Plus_v65"

          echo "=== VERIFY PREBUILT EXECUTABLE ==="
          VERSION="$("$PROJECT/Nougat_Media_Plus_v65" --version)"
          printf '%s\n' "$VERSION"
          printf '%s\n' "$VERSION" | grep -q '^Nougat Media Plus v0\.0\.65$' || {
              echo "STOP: v65 executable version verification failed."
              false
          }

          echo "=== REFRESH SIDEBAR/DOCK ICON WITH CLEANED ARTWORK ==="
          ICON="$PROJECT/assets/branding/nougat-media-plus-master-N.png"
          mkdir -p "$HOME/.local/share/icons/hicolor/256x256/apps"
          cp -f "$ICON" "$HOME/.local/share/icons/hicolor/256x256/apps/com.elderredsoftworks.NougatMediaPlus.png"
          cp -f "$ICON" "$HOME/.local/share/icons/hicolor/256x256/apps/nougat-media-plus.png"
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -f -t "$HOME/.local/share/icons/hicolor" >/dev/null 2>&1 || true
          fi
          if command -v gio >/dev/null 2>&1; then
              gio set "$PROJECT/Nougat_Media_Plus_v65" metadata::custom-icon "file://$ICON" || true
          fi

          APPDIR="$HOME/.local/share/applications"
          if [ -d "$APPDIR" ]; then
              while IFS= read -r desktop; do
                  if grep -Eqi 'Nougat[ _-]?Media[ _-]?(Plus|Suite)|NougatMediaPlus' "$desktop"; then
                      cp -a "$desktop" "$SNAP/desktop-files/$(basename "$desktop")"
                      python3 - "$desktop" "$ICON" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); icon=sys.argv[2]
          lines=p.read_text(errors='replace').splitlines()
          out=[]; changed=False
          for line in lines:
              if line.startswith('Icon='):
                  out.append('Icon='+icon); changed=True
              else:
                  out.append(line)
          if not changed:
              out.append('Icon='+icon)
          p.write_text('\n'.join(out)+'\n')
          PY
                  fi
              done < <(find "$APPDIR" -maxdepth 1 -type f -name '*.desktop' -print)
          fi

          echo "=== KEEP ONLY CURRENT ROOT EXECUTABLE ==="
          find "$PROJECT" -maxdepth 1 -type f -name 'Nougat_Media_Plus_v*' \
              ! -name 'Nougat_Media_Plus_v65' -print -delete
          rm -rf "$PROJECT/build-v65-candidate"

          echo
          echo "PASS: Nougat Media Plus v0.0.65 Visible Military UI Repair 3 applied."
          echo "EXECUTABLE: $PROJECT/Nougat_Media_Plus_v65"
          echo "SNAPSHOT: $SNAP"
          echo "NO LOCAL REBUILD WAS PERFORMED."
          BASH
          chmod +x "$ROOT/apply_v65.sh"

          cd "$GITHUB_WORKSPACE/dist"
          zip -qr "$NAME.zip" "$NAME"
          sha256sum "$NAME.zip" | tee "$NAME.sha256.txt"

      - name: Upload normal v65 download package
        uses: actions/upload-artifact@v4
        with:
          name: Nougat_Media_Plus_v0.0.65_VISIBLE_UI_REPAIR3
          path: ${{ github.workspace }}/dist/Nougat_Media_Plus_v0.0.65_VISIBLE_UI_REPAIR3.zip
          if-no-files-found: error
          retention-days: 7
