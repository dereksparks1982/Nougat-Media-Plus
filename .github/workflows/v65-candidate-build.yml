name: Nougat Media Plus v0.0.65 Candidate Build

on:
  push:
    branches:
      - candidate/v0.0.65
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v65:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          ref: candidate/v0.0.65
          lfs: false
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libx11-dev libtorrent-rasterbar-dev git-lfs

      - name: Fetch only required AI link runtime
        run: |
          git lfs install --local
          git lfs pull --include='components/ai/runtime/**' --exclude='*'

      - name: Apply v65 source patch
        run: |
          python3 tools/v65_patch.py
          grep -q 'v0.0.65' src/main.cpp
          grep -q 'NOUGAT_V65_APPROVED_MILITARY_SEEK' src/main.cpp
          grep -q 'NOUGAT_V65_RADIO_SERVICE_LANE' src/main.cpp

      - name: Configure
        run: |
          cmake -S . -B build-v65 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build-v65 --target Nougat_Media_Plus_v65 -j2

      - name: Verify version
        run: |
          ./build-v65/Nougat_Media_Plus_v65 --version | tee v65-version.txt
          grep -q 'Nougat Media Plus v0.0.65' v65-version.txt

      - name: Prepare candidate package
        run: |
          mkdir -p out-v65/src/chat out-v65/tools
          cp build-v65/Nougat_Media_Plus_v65 out-v65/
          cp src/main.cpp out-v65/src/main.cpp
          cp src/chat/nougat_chat.hpp src/chat/nougat_chat.cpp out-v65/src/chat/
          cp CMakeLists.txt out-v65/
          cp tools/v65_patch.py out-v65/tools/
          cp v65-version.txt out-v65/
          sha256sum out-v65/Nougat_Media_Plus_v65 > out-v65/SHA256.txt
          cat > out-v65/README_CANDIDATE.txt <<'TXT'
          Nougat Media Plus v0.0.65 candidate
          Base: accepted v0.0.64 commit dbe202300f48c8e53b4ee5ab169b6f9e8e4e2395
          Includes: approved military seek renderer for regular/half-screen and fullscreen, Radio two-row horizontally scrollable service lane using the complete existing Radio inventory, TV antenna scan ownership moved out of Radio UI, and Nougat Chat model scaffolding.
          This is a candidate for owner testing, not an accepted release.
          TXT

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nougat_Media_Plus_v0.0.65_candidate
          path: out-v65/
          if-no-files-found: error
