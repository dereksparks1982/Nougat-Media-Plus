name: Clean trailing README version references

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-final-sequence-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Clean README tail through GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['GH_REPO']
          api = f'https://api.github.com/repos/{repo}/contents/README.md'

          def req(method='GET', data=None):
              r = urllib.request.Request(api, method=method)
              r.add_header('Authorization', f'Bearer {token}')
              r.add_header('Accept', 'application/vnd.github+json')
              r.add_header('X-GitHub-Api-Version', '2022-11-28')
              if data is not None:
                  r.add_header('Content-Type', 'application/json')
                  r.data = json.dumps(data).encode()
              with urllib.request.urlopen(r) as f:
                  return json.loads(f.read().decode())

          current = req()
          sha = current['sha']
          text = base64.b64decode(current['content']).decode()

          note_pat = re.compile(
              r'\n### Viewing-history completion repair\n'
              r'(.*?)(?=\n## |\Z)', re.S
          )
          m = note_pat.search(text)
          note = m.group(1).strip() if m else ''
          if m:
              text = text[:m.start()] + '\n' + text[m.end():]

          if note:
              v19 = re.search(r'(?m)^## .*?v0\.0\.19\b.*$', text)
              if not v19:
                  raise SystemExit('v0.0.19 section not found')
              next_h = re.search(r'(?m)^## .*?v0\.0\.18\b.*$', text[v19.end():])
              if not next_h:
                  raise SystemExit('v0.0.18 boundary not found')
              insert_at = v19.end() + next_h.start()
              addition = '\n\n### Viewing-history completion repair\n\n' + note + '\n'
              text = text[:insert_at].rstrip() + addition + '\n' + text[insert_at:].lstrip()

          text = re.sub(
              r'\n## Running the current development build\n.*?(?=\n# Release history|\n## Licensing and third-party software|\Z)',
              '\n', text, flags=re.S
          )

          text = re.sub(
              r'\n# Release history\n\nThe entries below describe why each numbered ReddMedia build existed and what changed for the user\. They are reconstructed from the versioned build handshakes, validation records, changelog, and source history in this repository\.\n',
              '\n', text
          )

          version_heads = [int(x) for x in re.findall(r'(?m)^##\s+.*?v0\.0\.(\d+)\b.*$', text)]
          if version_heads != list(range(55, 0, -1)):
              raise SystemExit('Release heading order is not exactly 55 through 1: ' + str(version_heads))

          v1 = re.search(r'(?m)^## .*?v0\.0\.1\b.*$', text)
          if not v1:
              raise SystemExit('v0.0.1 section not found')
          next_after_v1 = re.search(r'(?m)^##\s+', text[v1.end():])
          if next_after_v1:
              tail_start = v1.end() + next_after_v1.start()
              tail = text[tail_start:]
              leftovers = sorted(set(re.findall(r'v\.?0\.0\.\d+', tail, flags=re.I)))
              if leftovers:
                  raise SystemExit('Version references remain after v0.0.1: ' + ', '.join(leftovers))

          payload = {
              'message': 'Finish README sequential version history v0.0.55 through v0.0.1',
              'content': base64.b64encode(text.encode()).decode(),
              'sha': sha,
              'branch': 'main'
          }
          result = req('PUT', payload)
          print('README_COMMIT=' + result['commit']['sha'])
          print('ORDER_OK=55_TO_1')
          PY