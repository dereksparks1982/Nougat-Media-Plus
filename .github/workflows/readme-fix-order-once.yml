name: Fix README version ordering
on:
  push:
    branches: [main]
    paths: [.github/workflows/readme-fix-order-once.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix README heading and remove stray duplicate
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          import base64, json, os, re, urllib.request
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          url = f'https://api.github.com/repos/{repo}/contents/README.md?ref=main'
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as r:
              data = json.load(r)
          text = base64.b64decode(data['content']).decode()
          text = text.replace('## v.0.0.55 - Background Web Player and Complete Runnable Project Checkpoint', '## v0.0.55 - Background Web Player and Complete Runnable Project Checkpoint', 1)
          text = re.sub(r'\n## v0\.0\.26 candidate\n.*\Z', '\n', text, flags=re.S)
          payload = json.dumps({'message':'Fix README sequential version order','content':base64.b64encode(text.encode()).decode(),'sha':data['sha'],'branch':'main'}).encode()
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/README.md', data=payload, headers={**headers,'Content-Type':'application/json'}, method='PUT')
          with urllib.request.urlopen(req) as r:
              json.load(r)
          wurl = f'https://api.github.com/repos/{repo}/contents/.github/workflows/readme-fix-order-once.yml?ref=main'
          req = urllib.request.Request(wurl, headers=headers)
          with urllib.request.urlopen(req) as r:
              w = json.load(r)
          payload = json.dumps({'message':'Remove one-shot README order fixer','sha':w['sha'],'branch':'main'}).encode()
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/.github/workflows/readme-fix-order-once.yml', data=payload, headers={**headers,'Content-Type':'application/json'}, method='DELETE')
          with urllib.request.urlopen(req) as r:
              json.load(r)
