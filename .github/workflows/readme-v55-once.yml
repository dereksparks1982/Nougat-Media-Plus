name: Apply Nougat v0.0.55 README update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-v55-once.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update README exactly in place
        shell: bash
        env:
          V55_SECTION_B64: 
          INTRO_ADD_B64: 
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os, re
          p = Path('README.md')
          text = p.read_text()
          text = re.sub(r'\n## Current Status\n.*?(?=\n## v0\.0\.55|\n## v0\.0\.54)', '\n', text, flags=re.S)
          text = re.sub(r'\n## v0\.0\.55\b.*?(?=\n## v0\.0\.54)', '\n', text, flags=re.S)
          intro = base64.b64decode(os.environ['INTRO_ADD_B64']).decode()
          branding = 'The interface uses Nougat Media Suite branding throughout the application, desktop launchers, executable identity, window identity, and system integration, with the approved Nougat N artwork and the suite-wide cream, caramel, chocolate, and feature-specific visual design.'
          if intro.strip() not in text:
              if branding not in text:
                  raise SystemExit('README branding anchor not found')
              text = text.replace(branding, intro + branding, 1)
          anchor = '## v0.0.54 - Professional File Splitter and Silver Screen Studio'
          if anchor not in text:
              raise SystemExit('v0.0.54 README anchor not found')
          v55 = base64.b64decode(os.environ['V55_SECTION_B64']).decode()
          text = text.replace(anchor, v55 + anchor, 1)
          p.write_text(text)
          PY
          rm -f .github/workflows/readme-v55-once.yml
          git config user.name "Derek Sparks"
          git config user.email "dereksparks1982@gmail.com"
          git add README.md .github/workflows/readme-v55-once.yml
          git commit -m "Update README for Nougat Media Suite v0.0.55"
          git push origin HEAD:main
