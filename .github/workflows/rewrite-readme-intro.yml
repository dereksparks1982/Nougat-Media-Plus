name: Rewrite Nougat Media Plus README Intro

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rewrite-readme-intro.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Rewrite README introduction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          marker = '## v0.0.62 - Nougat Media Plus Tactical UI Conversion'
          if marker not in text:
              raise SystemExit('v0.0.62 README marker not found')

          history = text[text.index(marker):]

          intro = '''# Nougat Media Plus

**Nougat Media Plus** is a native Linux entertainment and media platform developed by **Elderred Softworks LLC**. It brings television, radio, local media, streaming, games, production tools, connected hardware, and network playback together in one unified desktop application.

## **Media & Playback**

The built-in **Video Player** handles local and network media with playback controls, seeking, fullscreen playback, volume, chapters, resume state, episode progression, Up Next, keyboard and mouse controls, and Live TV channel navigation.

**Home** provides Continue Watching and media shelves. **Library** manages movies, television, music, videos, artwork, metadata, persistent media folders, playback history, automatic discovery, list and grid views, collection organization, and owner-controlled metadata correction through Fix Match.

**Discover** provides recommendation-oriented browsing, while **Nougat Search** combines privacy-focused search, crawler infrastructure, decentralized-search foundations, Secure Search protections, P2P downloading, magnet and torrent support, stream-while-downloading playback, metadata retrieval, playable-file selection, transfer progress, security analysis, and on-device recommendation intelligence.

## **Live Television**

**Live TV** supports compatible over-the-air television hardware, including Hauppauge WinTV devices and HDHomeRun network tuners. The television system includes tuner discovery, channel scanning, channel storage, guide data, native playback, channel navigation, tuner diagnostics, artwork, preferred-device handling, physical-device grouping, and independent tuner-resource allocation when supported by the connected hardware.

**World TV** extends television beyond antenna reception with internet-accessible broadcaster sources, guide integration, source verification, asynchronous stream resolution, alternate-source recovery, playback-health diagnostics, bounded connection and retry handling, station artwork, source diagnostics, and clear failure reporting.

## **Radio & Signal Monitoring**

**Radio** provides a unified receiver, scanner, and signal-monitoring environment. Its service surface covers local and internet radio alongside AM, FM, HD Radio, DAB/DAB+, DRM, longwave, mediumwave, shortwave, weather, emergency, public-safety, aviation, marine, railroad, amateur radio, digital radio systems, beacon services, aircraft and marine data, weather satellite, amateur satellite, and ISS/satellite reception paths.

Professional receiver controls include direct frequency entry, modulation and tuning-step controls, bandwidth and filtering, gain and AGC, squelch, scanning, signal monitoring, favorites, recordings, presets, spectrum and waterfall foundations, automatic hardware discovery, multiple receiver resources, provider-neutral hardware handling, and expandable SDR and decoder backends.

Services unavailable with the connected hardware are identified as unavailable rather than presented as active. Encrypted traffic is identified as encrypted or locked rather than represented as decrypted.

## **Cellular Lab**

**Cellular Lab** provides a foundation for private, controlled cellular-network experimentation using owned or explicitly authorized equipment. Its architecture includes historical and private-network concepts, subscriber and SIM management, enrolled test devices, local calls and SMS, RF and spectrum monitoring, protocol diagnostics, and network-health tooling.

Actual transmission features depend on compatible hardware, implementation status, authorization, and appropriate spectrum conditions.

## **Games**

**Games** provides a unified game library and emulator front end with persistent ROM folders, ZIP-contained game discovery, system recognition, artwork, controller support, emulator selection, managed emulator runtimes, and embedded gameplay where supported.

Nougat Media Plus supports legally redistributable test and homebrew content while users provide their own legally obtained commercial game dumps and any firmware or BIOS required by individual emulator platforms.

## **Studio & Drone Production**

**Studio** provides integrated media-production, file-production, and planning tools. File Splitter creates verified split sets with target-based sizing, while File Assembler discovers numbered parts, validates ordering, sizes, and hashes, reconstructs the original payload, and verifies final integrity.

**Drone Production** provides a director-oriented aerial-production environment for simulation, telemetry, camera and gimbal coordination, repeatable flight paths, mission planning, and Director Shot workflows that keep aircraft movement, camera movement, timing, subject tracking, and shot metadata together.

## **Streaming & Network Media**

**Stream** provides direct URL playback and webpage access for supported internet-video sources and services.

Nougat Media Plus also includes a **Jellyfin-backed media-server foundation** and a Nougat-branded **Web Player** for browsers and devices on the local network. Local media access is designed to operate without a mandatory cloud account, cloud relay, or Internet connection.

The network-media architecture supports phones, tablets, laptops, televisions, browsers, and other LAN clients while keeping Nougat Media Plus as the visible user-facing experience and Jellyfin as backend catalog infrastructure.

## **Diagnostics, Privacy & Hardware Integration**

Nougat Media Plus includes diagnostic and system-status tools, hardware reporting, server-health monitoring, media and tuner diagnostics, security-scanning foundations, persistent application state, privacy infrastructure, and expandable service integrations.

Its modular architecture is designed so new media, tuner, receiver, emulator, networking, search, privacy, production, and hardware capabilities can be added without replacing the rest of the application.

## **Nougat Media Plus Interface**

Beginning with **v0.0.62**, Nougat Media Plus uses the approved black and deep-green tactical interface and metallic tactical-green **N** identity across the application, launcher, executable, window identity, GNOME dock/app switcher, and in-app branding.

The tactical visual system coordinates navigation, panels, controls, dialogs, status surfaces, application identity, and UI interaction sounds while preserving the functionality of the individual Nougat systems.

## **Platform & Repository**

Nougat Media Plus is developed primarily as a **native Linux desktop application**.

The GitHub repository preserves the complete runnable Nougat Media Plus project tree, including source, assets, tools, bundled runtimes, emulator components, media-server infrastructure, AI components, security components, and required project dependencies. Oversized project files are stored through **Git LFS** rather than intentionally omitted from project history.

## **Educational and Lawful Use Notice**

Nougat Media Plus is provided for **educational, research, testing, and development purposes only**. Elderred Softworks LLC does not endorse, encourage, authorize, or condone unlawful activity, unauthorized access, unauthorized interception or surveillance, circumvention of access controls, harassment, injury, property damage, invasion of privacy, intellectual-property infringement, interference with communications or services, or other harmful or illegal activity.

Users are responsible for ensuring that their use of Nougat Media Plus complies with applicable laws, regulations, licensing requirements, spectrum and communications rules, privacy obligations, intellectual-property rights, contractual restrictions, and third-party terms. Features involving networks, radio, cellular systems, devices, accounts, media, signals, or data should be used only with resources the user owns or is explicitly authorized to access, operate, test, receive, modify, or analyze.

Nothing in Nougat Media Plus, its source code, or its documentation grants permission to perform an act that would otherwise be unlawful, unauthorized, or harmful. Availability of a technical capability does not imply legal authorization to use it in a particular jurisdiction, environment, or circumstance.

'''

          path.write_text(intro + history)
          PY

      - name: Commit README and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "DKLab Release Bot"
          git config user.email "dereksparks1982@users.noreply.github.com"
          git rm .github/workflows/rewrite-readme-intro.yml
          git add README.md
          git diff --cached --check
          git commit -m "Polish Nougat Media Plus README introduction"
          git push origin HEAD:main
