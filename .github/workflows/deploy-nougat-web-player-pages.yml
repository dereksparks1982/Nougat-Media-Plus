name: Nougat Web Player Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "config.js"
      - "app.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "assets/branding/nougat-media-plus-dock-N.png"
      - "assets/branding/nougat-media-plus-topbar-lockup.png"
      - ".github/workflows/deploy-nougat-web-player-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nougat-web-player-pages
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete gh-pages branch and force workflow Pages mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/gh-pages" || true
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || true

  deploy:
    needs: cleanup
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate web player
        shell: bash
        run: |
          set -euo pipefail
          node --check config.js
          node --check app.js
          node --check sw.js
          python3 -m json.tool manifest.webmanifest >/dev/null
          grep -q 'https://97-201-65-144.sslip.io' config.js
          grep -q './styles.css' index.html
          grep -q './app.js' index.html
          grep -q './nougat-media-plus-topbar-lockup.png' index.html
          grep -q './nougat-media-plus-dock-N.png' index.html

      - name: Build Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp styles.css _site/styles.css
          cp config.js _site/config.js
          cp app.js _site/app.js
          cp sw.js _site/sw.js
          cp manifest.webmanifest _site/manifest.webmanifest
          cp assets/branding/nougat-media-plus-dock-N.png _site/nougat-media-plus-dock-N.png
          cp assets/branding/nougat-media-plus-topbar-lockup.png _site/nougat-media-plus-topbar-lockup.png
          touch _site/.nojekyll

      - name: Configure Pages from main build
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
