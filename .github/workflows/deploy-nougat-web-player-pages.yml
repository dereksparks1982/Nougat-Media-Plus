name: Nougat Web Player Pages

on:
  push:
    branches: [main]
    paths:
      - "components/web_player/**"
      - "assets/branding/nougat-media-plus-dock-N.png"
      - ".github/workflows/deploy-nougat-web-player-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nougat-web-player-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate web player
        shell: bash
        run: |
          set -euo pipefail
          node --check components/web_player/config.js
          node --check components/web_player/app.js
          node --check components/web_player/sw.js
          python3 -m json.tool components/web_player/manifest.webmanifest >/dev/null
          grep -q 'https://97-201-65-144.sslip.io' components/web_player/config.js
          grep -q './styles.css' components/web_player/index.html
          grep -q './app.js' components/web_player/index.html

      - name: Build Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp components/web_player/index.html _site/index.html
          cp components/web_player/styles.css _site/styles.css
          cp components/web_player/config.js _site/config.js
          cp components/web_player/app.js _site/app.js
          cp components/web_player/sw.js _site/sw.js
          cp components/web_player/manifest.webmanifest _site/manifest.webmanifest
          cp assets/branding/nougat-media-plus-dock-N.png _site/nougat-icon.png
          touch _site/.nojekyll

      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
