name: Nougat Web Player Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "modules.css"
      - "enhancements.css"
      - "config.js"
      - "app.js"
      - "player-enhancements.js"
      - "modules.js"
      - "modules-bridge.js"
      - "modules-*.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "assets/branding/nougat-media-plus-dock-N.png"
      - "assets/branding/nougat-media-plus-topbar-lockup.png"
      - "components/games/bundled/**"
      - ".github/workflows/deploy-nougat-web-player-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nougat-web-player-pages
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete gh-pages branch and force workflow Pages mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/gh-pages" || true
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || true

  deploy:
    needs: cleanup
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate web player
        shell: bash
        run: |
          set -euo pipefail
          node --check config.js
          node --check app.js
          node --check player-enhancements.js
          node --check modules.js
          node --check modules-bridge.js
          for f in modules-*.js; do node --check "$f"; done
          node --check sw.js
          python3 -m json.tool manifest.webmanifest >/dev/null
          grep -q 'https://97-201-65-144.sslip.io' config.js
          grep -q './styles.css' index.html
          grep -q './modules.css' index.html
          grep -q './enhancements.css' index.html
          grep -q './app.js' index.html
          grep -q './player-enhancements.js' index.html
          grep -q './modules.js' index.html
          grep -q './modules-bridge.js' index.html
          grep -q './assets/branding/nougat-media-plus-topbar-lockup.png' index.html
          grep -q './assets/branding/nougat-media-plus-dock-N.png' index.html
          test -f components/games/bundled/2048.nes
          test -f components/games/bundled/Waveforms.nes
          test -f "components/games/bundled/Ultima Online - The Second Age/Ultima Online - The Second Age.nougat-uo"

      - name: Build Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets/branding _site/components/games
          cp index.html _site/index.html
          cp styles.css _site/styles.css
          cp modules.css _site/modules.css
          cp enhancements.css _site/enhancements.css
          cp config.js _site/config.js
          cp app.js _site/app.js
          cp player-enhancements.js _site/player-enhancements.js
          cp modules.js _site/modules.js
          cp modules-bridge.js _site/modules-bridge.js
          for f in modules-*.js; do cp "$f" "_site/$f"; done
          cp sw.js _site/sw.js
          cp manifest.webmanifest _site/manifest.webmanifest
          cp assets/branding/nougat-media-plus-dock-N.png _site/assets/branding/nougat-media-plus-dock-N.png
          cp assets/branding/nougat-media-plus-topbar-lockup.png _site/assets/branding/nougat-media-plus-topbar-lockup.png
          cp -R components/games/bundled _site/components/games/bundled
          touch _site/.nojekyll

      - name: Configure Pages from main build
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
