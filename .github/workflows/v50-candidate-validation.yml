name: v50 Candidate Validation

on:
  push:
    branches:
      - candidate/v0.0.50
  pull_request:
    branches:
      - main
      - candidate/v0.0.50
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libx11-dev python3 xvfb xauth

      - name: Apply guarded v50 source migration
        run: |
          python3 tools/apply_v50_core.py
          python3 tools/apply_v50_dialog_labels.py
          python3 tools/apply_v50_plugin_foundation.py

      - name: Validate v50 source and plugin contract
        run: python3 tools/test_nougat_media_suite_v50.py .

      - name: Validate Workshop split archive
        run: python3 tests/v50/test_workshop_split_archive.py

      - name: Validate player-only and Workshop installer lifecycle
        run: python3 tests/v50/test_plugin_installer.py

      - name: Configure lean v50 native build
        run: >-
          cmake -S . -B /tmp/nougat-v50-build
          -DNOUGAT_P2P_MODE=STUB
          -DNOUGAT_AI_MODE=STUB
          -DCMAKE_BUILD_TYPE=Release

      - name: Compile built-in plugin registry self-test
        run: cmake --build /tmp/nougat-v50-build --target nougat_plugin_registry_self_test -j2

      - name: Prove physical plugin folder discovery
        run: /tmp/nougat-v50-build/nougat_plugin_registry_self_test

      - name: Compile v50 with warnings as errors
        run: cmake --build /tmp/nougat-v50-build --target Nougat_Media_Suite_v50 -j2

      - name: Verify v50 executable identity
        run: |
          test -x /tmp/nougat-v50-build/Nougat_Media_Suite_v50
          test "$(/tmp/nougat-v50-build/Nougat_Media_Suite_v50 --version)" = "Nougat Media Suite v0.0.50"

      - name: Run retained non-display native self-tests
        run: |
          /tmp/nougat-v50-build/Nougat_Media_Suite_v50 --v49-games-self-test
          /tmp/nougat-v50-build/Nougat_Media_Suite_v50 --v47-nav-self-test

      - name: Run retained X11 native self-tests
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" /tmp/nougat-v50-build/Nougat_Media_Suite_v50 --v47-fullscreen-controls-self-test
          xvfb-run -a -s "-screen 0 1920x1080x24" /tmp/nougat-v50-build/Nougat_Media_Suite_v50 --v47-window-identity-self-test

      - name: Build and verify canonical lean source ZIP
        run: python3 tools/package_v50_source.py /tmp/Nougat_Media_Suite_v0.0.50_SOURCE_CANDIDATE.zip

      - name: Build and verify installable v50 bundle
        run: |
          cp /tmp/nougat-v50-build/Nougat_Media_Suite_v50 ./Nougat_Media_Suite_v50
          chmod +x ./Nougat_Media_Suite_v50
          python3 tools/package_v50_installer.py --output /tmp/Nougat_Media_Suite_v0.0.50_INSTALLER.zip
          rm -f ./Nougat_Media_Suite_v50

      - name: Install and exercise the actual packaged v50 bundle
        run: python3 tests/v50/test_installer_bundle.py /tmp/Nougat_Media_Suite_v0.0.50_INSTALLER.zip

      - name: Upload v50 installer
        uses: actions/upload-artifact@v4
        with:
          name: Nougat_Media_Suite_v0.0.50_INSTALLER
          path: /tmp/Nougat_Media_Suite_v0.0.50_INSTALLER.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload v50 candidate source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Nougat_Media_Suite_v0.0.50_SOURCE_CANDIDATE
          path: /tmp/Nougat_Media_Suite_v0.0.50_SOURCE_CANDIDATE.zip
          if-no-files-found: error
          retention-days: 14
