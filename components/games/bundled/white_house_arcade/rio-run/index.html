:root {

  --charcoal: #293340;
  --deep-navy-blue: #0d132d;
  --navy-blue: #151a30;
  --navy-accent: #141f4d;
  --zodiac-blue: #0b1b33;
  --vivid-cyan: #0dcbff;
  --money: #389800;
  --amber: #ffbd00;
  --deep-red: #730000;
  --red: #b50000;
  --gray: #8a8a8a;
  --pale-gray: #d9dee8;
  --stone: #e8e6e0;
  --light-gray: #f3f3f3;
  --white: #ffffff;

  --ui-paper: var(--white);
  --ui-paper-alt: var(--light-gray);
  --ui-stone: var(--stone);
  --ui-ink: var(--deep-navy-blue);
  --ui-ink-soft: var(--charcoal);
  --ui-muted: #4f586b;
  --ui-disabled-ink: #626979;
  --ui-rule: var(--gray);
  --ui-rule-strong: var(--navy-accent);
  --ui-official: var(--red);
  --ui-official-deep: var(--deep-red);
  --ui-progress: var(--amber);
  --ui-progress-ink: #684e00;
  --ui-positive-ink: #286c0a;
  --ui-paper-glass: rgb(255 255 255 / 96%);
  --ui-paper-glass-strong: rgb(255 255 255 / 98%);
  --ui-header-rule: rgb(255 255 255 / 26%);
  --ui-header-control-rule: rgb(217 222 232 / 48%);
  --ui-shadow: rgb(0 0 0 / 28%);
  --ui-shadow-strong: rgb(0 0 0 / 55%);

  --bg: var(--deep-navy-blue);
  --panel: var(--navy-blue);
  --ink: var(--stone);
  --muted: #8d97ad;
  --accent: var(--amber);

  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Instrument Serif", Georgia, serif;

  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

.game-body,
.menu-body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
}

.hint {
  color: var(--muted);
  font-size: 12px;
}

.game-body {
  display: flex;
  flex-direction: column;

  height: 100svh;
}

.game-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 12px;
  background: var(--panel);
  flex: 0 0 auto;
}

footer.game-bar {
  justify-content: flex-start;
}

footer.game-bar .brand {
  margin-left: auto;
  flex: 0 0 auto;
}

footer.game-bar .hint {
  min-width: 0;
}

.game-bar h1 {
  margin: 0;

  font-family: var(--serif);
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0.01em;
}

.back {
  color: var(--muted);
  text-decoration: none;
}

.back:hover,
.back:focus-visible {
  color: var(--vivid-cyan);
}

.back:focus-visible {
  outline: 2px solid var(--vivid-cyan);
  outline-offset: 4px;
}

.monumental-body > .game-bar {
  min-height: 50px;
  padding: 8px 16px;
  border-block: 1px solid var(--ui-header-rule);
  background: var(--deep-navy-blue);
}

.monumental-body > .game-bar h1 {
  letter-spacing: 0.04em;
  line-height: 1;
}

.stage {
  flex: 1 1 auto;
  min-height: 0;
  display: block;
  position: relative;

  cursor: none;

  user-select: none;
  touch-action: none;
}

.stage[data-pointer] {
  cursor: default;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.pixel-screen {
  display: block;
  image-rendering: pixelated;
}

.pixel-screen.smooth-screen {
  image-rendering: auto;
}

.stage.render-3d {
  position: relative;
}

.stage.render-3d > canvas {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;
  object-fit: contain;
}

.stage.render-3d > canvas:not(.pixel-screen) {
  z-index: 0;
  image-rendering: auto;
  pointer-events: none;
}

.stage.render-3d > .pixel-screen {
  z-index: 1;

  background: transparent;
}

@media (max-width: 420px) {
  footer.game-bar {
    gap: 8px;
    padding: 8px;
  }

  footer.game-bar .toggle {
    padding: 4px 8px;
    font-size: 11px;
  }

  footer.game-bar .brand {
    padding: 3px 7px;
    font-size: 10px;
    letter-spacing: 0.04em;
  }

  footer.game-bar .hint {
    font-size: 11px;
  }
}

@media (max-height: 560px) {
  .game-bar {
    padding: 4px 10px;
  }

  .game-bar h1 {
    font-size: 15px;
  }

  .game-bar .hint {
    display: none;
  }
}

@media (max-height: 400px) {

  .game-bar {
    display: none;
  }

  footer.game-bar {
    display: flex;
    padding: 2px 8px;
    background: none;
  }

  footer.game-bar .hint,
  footer.game-bar .brand {
    display: none;
  }
}

.embed .game-bar {
  display: none;
}

.menu-body {
  display: grid;
  place-items: center;
  min-height: 100svh;
  padding: 24px;
}

.menu {
  width: min(560px, 100%);
}

.menu h1 {
  margin: 0 0 6px;
  font-family: var(--serif);
  font-size: 40px;
  font-weight: 400;
  line-height: 1.1;
}

.game-list {
  list-style: none;
  margin: 24px 0 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.game-list a {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 14px 16px;
  background: var(--panel);
  border-radius: 8px;
  color: var(--ink);
  text-decoration: none;
  border: 1px solid transparent;
}

.game-list a:hover,
.game-list a:focus-visible {
  border-color: var(--vivid-cyan);
}

.game-list span {
  color: var(--muted);
  font-size: 12px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border: 1px solid var(--navy-accent);
  border-radius: 999px;
  background: var(--zodiac-blue);
  color: var(--ink);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
  white-space: nowrap;
}

.brand:hover,
.brand:focus-visible {
  border-color: var(--amber);
}

.brand-mark {
  color: var(--accent);
  font-size: 12px;
  line-height: 1;
}

.brand-text {
  font-weight: 600;
}

.brand-lead {
  margin-top: 14px;
  padding: 6px 14px;
  font-size: 12px;
}

.toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border: 1px solid var(--navy-accent);
  border-radius: 999px;
  background: var(--zodiac-blue);
  color: var(--ink);
  font: inherit;
  font-size: 12px;

  white-space: nowrap;
  flex: 0 0 auto;
  cursor: pointer;
}

.toggle:hover {
  border-color: var(--accent);
}

.mobile-pad {
  display: none;
  position: fixed;
  right: 12px;
  bottom: 64px;
  z-index: 20;
  width: 148px;
  height: 148px;
  touch-action: none;
  user-select: none;
  pointer-events: none;
}

.mobile-pad button {
  pointer-events: auto;
  position: absolute;
  width: 46px;
  height: 46px;
  border: 1px solid var(--navy-accent);
  border-radius: 10px;
  background: rgb(11 27 51 / 86%);
  color: var(--stone);
  font: 700 18px var(--sans);
  line-height: 1;
  -webkit-tap-highlight-color: transparent;
}

.mobile-pad button:active {
  background: rgb(13 203 255 / 28%);
  border-color: var(--vivid-cyan);
}

.mobile-pad .up    { left: 51px; top: 0; }
.mobile-pad .left  { left: 0; top: 51px; }
.mobile-pad .right { left: 102px; top: 51px; }
.mobile-pad .down  { left: 51px; top: 102px; }

@media (hover: none) and (pointer: coarse) {
  .mobile-pad { display: block; }
  .stage { cursor: default; }
  footer.game-bar .hint { display: none; }
}

@media (max-width: 420px) {
  .mobile-pad {
    right: 8px;
    bottom: 56px;
    transform: scale(0.92);
    transform-origin: bottom right;
  }
}
</style>
</head>

    <main id="game" class="stage" aria-label="Rio Run playfield"></main>
    <footer class="game-bar">
      <button id="sound" class="toggle" type="button" aria-pressed="true">
        <span class="toggle-icon" aria-hidden="true">♪</span>
        <span class="toggle-text">Sound on</span>
      </button>
      <span class="hint">arrows or WASD to steer &middot; M mute &middot; R restart</span>


    </footer>

(() => {
  const pad = document.querySelector(".mobile-pad");
  if (!pad) return;

  const fire = (key, type) => {
    document.dispatchEvent(new KeyboardEvent(type, {
      key,
      bubbles: true,
      cancelable: true
    }));
  };

  pad.addEventListener("pointerdown", (event) => {
    const button = event.target.closest("button[data-key]");
    if (!button) return;
    event.preventDefault();
    button.setPointerCapture?.(event.pointerId);
    fire(button.dataset.key, "keydown");
  });

  const stop = (event) => {
    const button = event.target.closest("button[data-key]");
    if (!button) return;
    fire(button.dataset.key, "keyup");
  };

  pad.addEventListener("pointerup", stop);
  pad.addEventListener("pointercancel", stop);
})();
